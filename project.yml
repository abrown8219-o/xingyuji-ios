# XcodeGen 项目定义（GitHub Actions 云端自动生成 .xcodeproj 用）
name: Xingyuji
options:
  bundleIdPrefix: com.xingyuji
  deploymentTarget:
    iOS: "17.0"
targets:
  Xingyuji:
    type: application
    platform: iOS
    sources:
      - XingyujiApp.swift
      - Store.swift
      - MainScreen.swift
      - WebScreen.swift
      - Services.swift
    info:
      path: Info.plist
      generating: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingyuji.launcher.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
